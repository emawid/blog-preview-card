<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Blog Preview Card</title>
  </head>
  <body>
    <div id="container">
      <div id="img-wrapper">
        <img
          id="blog-image"
          src="./assets/images/illustration-article.svg"
          width="336"
          height="201"
          alt="illustration"
        />
      </div>
      <div id="content">
        <p id="category">Learning</p>
        <p id="publish-date">
          Published <time datetime="2023-12-21">21 Dec 2023</time>
        </p>
        <h1 id="title">HTML & CSS foundations</h1>
        <p id="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>
      <div id="author">
        <img
          src="./assets/images/image-avatar.webp"
          width="64"
          height="64"
          alt="avatar"
          id="userpic"
        />
        <p id="author-name">Greg Hooper</p>
      </div>
    </div>
  </body>
</html>
